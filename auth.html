
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCompass | Student Authentication</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0B1120;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            background: #111C30;
            padding: 35px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .auth-container h1 {
            text-align: center;
            color: #00D4FF;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #9CA3AF;
            margin-bottom: 28px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-form label {
            display: block;
            margin: 15px 0 7px;
            color: #D1D5DB;
            font-size: 14px;
        }

        .auth-form input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0B1120;
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        .auth-form input:focus {
            border-color: #00D4FF;
        }

        .email-preview {
            font-size: 12px;
            color: #9CA3AF;
            margin-top: 6px;
        }

        .auth-button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 8px;
            background: #00D4FF;
            color: #0B1120;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-switch {
            text-align: center;
            margin-top: 22px;
            color: #9CA3AF;
            font-size: 14px;
        }

        .auth-switch button,
        .forgot-link,
        .back-to-login {
            background: none;
            border: none;
            color: #00D4FF;
            cursor: pointer;
            font-weight: bold;
        }

        .forgot-link {
            display: block;
            margin: 14px 0 0 auto;
            padding: 0;
            font-size: 13px;
        }

        .back-to-login {
            display: block;
            margin: 18px auto 0;
        }

        #authMessage {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            line-height: 1.5;
        }

        #authMessage.success {
            display: block;
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
        }

        #authMessage.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
        }
    </style>
</head>

<body>
    <main class="auth-container">
        <h1>CampusCompass</h1>
        <p class="auth-subtitle">Your university journey, organised.</p>

        <!-- SIGN UP -->
        <form id="signupForm" class="auth-form active">
            <h2>Create Account</h2>

            <label for="signupName">Full Name</label>
            <input
                type="text"
                id="signupName"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

            <label for="signupEnrollment">Enrollment Number</label>
            <input
                type="text"
                id="signupEnrollment"
                placeholder="e.g. S26CSEU2828"
                autocomplete="username"
                required
            >

            <p class="email-preview">
                University email:
                <span id="emailPreview">your-enrollment@bennett.edu.in</span>
            </p>

            <label for="signupPassword">Password</label>
            <input
                type="password"
                id="signupPassword"
                placeholder="Minimum 8 characters"
                autocomplete="new-password"
                minlength="8"
                required
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter your password"
                autocomplete="new-password"
                required
            >

            <button type="submit" class="auth-button" id="signupButton">
                Create Account
            </button>
        </form>

        <!-- LOGIN -->
        <form id="loginForm" class="auth-form">
            <h2>Welcome Back</h2>

            <label for="loginEnrollment">Enrollment Number</label>
            <input
                type="text"
                id="loginEnrollment"
                placeholder="Enter your enrollment number"
                autocomplete="username"
                required
            >

            <label for="loginPassword">Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="auth-button" id="loginButton">
                Sign In
            </button>

            <button type="button" id="forgotPasswordLink" class="forgot-link">
                Forgot Password?
            </button>
        </form>

        <!-- FORGOT PASSWORD -->
        <form id="forgotPasswordForm" class="auth-form">
            <h2>Reset Your Password</h2>
            <p class="auth-subtitle">
                Enter your enrollment number. We'll send a reset link to your
                Bennett university email.
            </p>

            <label for="forgotEnrollment">Enrollment Number</label>
            <input
                type="text"
                id="forgotEnrollment"
                placeholder="Enter your enrollment number"
                autocomplete="username"
                required
            >

            <button type="submit" class="auth-button" id="resetEmailButton">
                Send Reset Link
            </button>

            <button type="button" id="backToLogin" class="back-to-login">
                Back to Sign In
            </button>
        </form>

        <div class="auth-switch" id="authSwitchContainer">
            <span id="switchText">Already have an account?</span>
            <button type="button" id="switchAuth">Sign In</button>
        </div>

        <div id="authMessage" role="status" aria-live="polite"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
</body>
</html>
