
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCompass | Reset Password</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0B1120;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .reset-container {
            width: 100%;
            max-width: 430px;
            box-sizing: border-box;
            background: #111C30;
            padding: 35px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
        }

        h1 {
            text-align: center;
            color: #00D4FF;
        }

        p {
            color: #9CA3AF;
            text-align: center;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            color: #D1D5DB;
            font-size: 14px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0B1120;
            color: white;
        }

        input:focus {
            outline: none;
            border-color: #00D4FF;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 8px;
            background: #00D4FF;
            color: #0B1120;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #resetMessage {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        #resetMessage.success {
            display: block;
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
        }

        #resetMessage.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
        }

        #resetForm {
            display: none;
        }

        #resetForm.active {
            display: block;
        }

        #resetError {
            display: none;
        }

        a {
            color: #00D4FF;
        }
    </style>
</head>

<body>
    <main class="reset-container">
        <h1>CampusCompass</h1>
        <p>Choose a new password for your account.</p>

        <form id="resetForm">
            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                placeholder="Minimum 8 characters"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirmNewPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmNewPassword"
                placeholder="Enter your new password again"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="updatePasswordButton">
                Update Password
            </button>
        </form>

        <p id="resetError">
            This password reset link is invalid or has expired.
            Please request a new one from the
            <a href="auth.html">login page</a>.
        </p>

        <div id="resetMessage" role="status" aria-live="polite"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
